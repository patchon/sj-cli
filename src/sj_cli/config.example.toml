# Copy to ~/.config/sj-cli/config.toml (or $XDG_CONFIG_HOME/sj-cli/config.toml)
# and fill in your own values. See SPEC.md §4 for validation rules.

[auth]
email = "user@example.com"
password = "your-password"

[search_parameters]
# Which days to book: dates (YYYY-MM-DD), ISO weeks (W43; 2027-W02 for another year),
# comma-separated, with inclusive START..END ranges (W45..46). Days already gone are
# skipped — put your own window here: a selection entirely in the past is rejected.
dates = "2026-09-01..2026-10-30"
# or, by week:  dates = "W36, W38..40"
time_leave = "05:29"
time_return = "17:22"
station_from = "Göteborg Central"
station_to = "Stockholm Central"
comfort_class = "2 class calm"    # "1 class", "2 class", "2 class calm"
flexibility = "FULLFLEX"          # FULLFLEX, SEMIFLEX, NOFLEX
roundtrip = true
select_closest_ticket_available = true
allow_class_fallback = true       # optional, defaults to true
book_partial = false              # optional; book the return leg alone if the outbound is unavailable (SPEC §6.5)
skip_weekends = true              # optional, defaults to true
skip_holidays = true              # optional, defaults to true — Swedish red days incl. Midsommar-/Jul-/Nyårsafton
service_types = ["SJ_HIGH", "SJ_IC"]  # optional; omit or ["ALL"] for no filter
# Valid: ALL, SJ_HIGH, SJ_IC, SJ_REG, SJ_NT, X_TRAINOPS, X_PTA, X_EXPBUS

# seat_preference — optional. Omit it and SJ assigns the seat.
#   "ask"                              prompt for every leg of every day
#   ["window", "table", "forward"]     ranked wish list, best free seat wins
# Words: window, aisle, table, solo, easy access, no animals, forward, backward
# (an earlier word outranks every later one; contradictions are rejected)
#seat_preference = ["window", "table"]
