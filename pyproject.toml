[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sj-cli"
version = "0.1.0"
description = "Book SJ (Swedish Railways) commuter trips on a travel pass from the command line."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Patrik Martinsson", email = "patrik@redlin.se" }]
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/patchon/sj-cli"
Repository = "https://github.com/patchon/sj-cli"
Issues = "https://github.com/patchon/sj-cli/issues"

[project.scripts]
sj-cli = "sj_cli.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sj_cli = ["config.example.toml"]

# --- ruff: lint + format (target version follows requires-python) ---------

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]  # design specs/plans: their code fences are illustrative

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- Style preferences inappropriate for this project ---
    "ANN",      # Missing type annotations — partial annotations are fine
    "D100",     # Undocumented public module
    "D102",     # Undocumented public method
    "D107",     # Undocumented public __init__
    "D200",     # Unnecessary multiline docstring
    "D212",     # Summary on the first line — docstrings put it on the second (D213)

    # --- CLI tool: printing is expected ---
    "T201",     # print() usage

    # --- Exception message style (too pedantic) ---
    "TRY003",   # Long messages outside exception class
    "TRY301",   # Abstract raise to inner function
    "EM101",    # String literal in exception
    "EM102",    # f-string literal in exception

    # --- Boolean arguments: would require major API refactor ---
    "FBT001",   # Boolean type hint positional argument
    "FBT002",   # Boolean default value positional argument
    "FBT003",   # Boolean positional value in call

    # --- Complexity limits: inherent in booking/auth flows ---
    "C901",     # Too complex
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PLR0917",  # Too many positional arguments

    # --- No copyright headers in this project ---
    "CPY001",   # Missing copyright notice

    # --- Datetime timezone: intentionally naive (local Swedish times) ---
    "DTZ005",   # call-datetime-now-without-tzinfo
    "DTZ006",   # call-datetime-fromtimestamp
    "DTZ007",   # call-datetime-strptime-without-zone
    "DTZ011",   # call-date-today

    # --- Broad exception catching is intentional for API resilience ---
    "BLE001",   # Blind except

    # --- Commented-out code detection has false positives ---
    "ERA001",   # Commented-out code

    # --- Magic values: HTTP status codes, timeouts, etc. are clear in context ---
    "PLR2004",  # Magic value comparison

    # --- Logging f-strings: acceptable for this project's scale ---
    "G004",     # Logging uses f-string

    # --- Style micro-rules not worth enforcing ---
    "COM812",   # Trailing comma missing (conflicts with the formatter)
    "TRY300",   # Consider moving to else block
    "TRY400",   # error() instead of exception() in logging
    "S110",     # try-except-pass
    "ARG002",   # Unused method argument (interface compliance)
    "RUF001",   # Ambiguous unicode (Swedish characters)
    "RUF002",   # Same, in docstrings (they quote the en dash the output renders)
    "RUF012",   # Mutable class default
    "S101",     # Use of assert (fine for type narrowing in CLI tool)
    "SIM116",   # if-else instead of dict lookup
    "PLC0415",  # Import outside top level
    "LOG015",   # Root logger call
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/sj_cli/client.py" = [
    "N806",     # Non-lowercase variable (STATION_MAP used locally)
]
"tests/*" = [
    "D",        # Docstrings: test names are the documentation
    "E501",     # Long lines in fixtures/assertions
    "PT018",    # Composite assertions read fine in characterisation tests
    "SLF001",   # Tests exercise private helpers on purpose
    "ARG001",   # Unused args in fake client signatures (interface compliance)
    "DTZ001",   # Naive datetimes mirror the production code
    "S105",     # "password": "x" in fixture config
]

# --- pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# --- mypy -----------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Tests drive the real code with duck-typed fakes (FakeClient for SJClient);
# only their annotated parts are checked.
module = "tests.*"
check_untyped_defs = false
